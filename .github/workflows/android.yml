name: android

# The Android app cannot be compiled in the dev sandbox (no JDK/SDK —
# ADR-006); GitHub Actions is the real compiler gate for the app:
# assembleDebug + JVM unit tests on every push and pull request.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Locked debug signature: PR #28 removed the committed debug
      # keystore (audit §4 — signing material does not belong in a
      # public repo), which left every CI run signing with a fresh
      # ephemeral key — and Android refuses to update-install an APK
      # whose signature changed, so the device needed an uninstall
      # before every test build. The same keystore now lives in the
      # DEBUG_KEYSTORE_B64 repo secret (never in the tree); restoring
      # it here makes every CI build share ONE debug signature.
      # Without the secret the build still works, just ephemerally.
      - name: Restore the locked debug keystore (stable APK signature)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$GITHUB_WORKSPACE/.ci"
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/.ci/debug.keystore"
            echo "TRMX_DEBUG_KEYSTORE=$GITHUB_WORKSPACE/.ci/debug.keystore" >> "$GITHUB_ENV"
            echo "locked debug keystore restored"
          else
            echo "DEBUG_KEYSTORE_B64 not set — ephemeral debug signature"
          fi

      # Evidence for the signature lock: the alias + fingerprint the
      # build will sign with (build.gradle.kts reads the path from
      # TRMX_DEBUG_KEYSTORE). Rounds 1–2 restored to ~/.android and
      # the build still minted a fresh key — the APK's own signer
      # fingerprint, printed after the build below, is the verdict.
      - name: Show the locked debug keystore
        run: |
          if [ -n "$TRMX_DEBUG_KEYSTORE" ] && [ -f "$TRMX_DEBUG_KEYSTORE" ]; then
            keytool -list -v -keystore "$TRMX_DEBUG_KEYSTORE" \
              -storepass android -alias androiddebugkey 2>&1 \
              | grep -E 'Alias name|SHA256:' || true
          fi

      - name: Spec conformance (Kotlin sources vs frozen contracts)
        run: python3 tests/spec_conformance.py

      - name: Build debug APK + run JVM unit tests
        working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Print the built APK's signer fingerprint
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs \
              android/app/build/outputs/apk/debug/app-debug.apk 2>&1 \
              | grep -iE 'SHA-256|SHA256' || true
          fi

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trmx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trmx-unit-test-results
          path: android/app/build/test-results/testDebugUnitTest/

  # The Termux bridge half of the product (audit §7-H1/H2/H5): its test
  # suite used to run nowhere in CI, and SHA256SUMS / bridge size were
  # manual, unverified nets. Pure Python — no JDK/Android SDK needed.
  termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Termux bridge test suites
        run: sh termux/tests/run_tests.sh

      - name: SHA256SUMS freshness (audit §7-H5)
        run: |
          cd termux
          sha256sum trmx-bridge.py trmx_bridge_lib.py trmx trmx-ai trmx_ai_lib.py trmx-agent > /tmp/sums.fresh
          if ! diff -u SHA256SUMS /tmp/sums.fresh; then
            echo "::error::termux/SHA256SUMS is stale — regenerate it from the tree"
            exit 1
          fi

      - name: Bridge size gate (audit §7-H2)
        env:
          # Audit §7-H2 target: 124 KiB — safety margin under the ~128 KB
          # tooling wall. (It ratcheted at 143360 while the Batch 1 + 1B
          # safety fixes had the bridge at 139860 bytes; the module split
          # — Policy/ToolRegistry/ServiceRegistry into trmx_bridge_lib.py
          # — brought the bridge back under the target, so the audit
          # number is restored. Growth past this fails CI.)
          BRIDGE_SIZE_LIMIT: "126976"
        run: |
          size=$(stat -c%s termux/trmx-bridge.py)
          echo "trmx-bridge.py: ${size} bytes (limit ${BRIDGE_SIZE_LIMIT})"
          if [ "$size" -gt "$BRIDGE_SIZE_LIMIT" ]; then
            echo "::error::trmx-bridge.py exceeds the ${BRIDGE_SIZE_LIMIT}-byte gate"
            exit 1
          fi
